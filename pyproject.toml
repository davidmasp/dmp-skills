[project]
name = "agent-skills"
version = "0.1.0"
description = "Git-native management and installation of AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
]

[project.scripts]
dmp-skills = "agent_skills.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
